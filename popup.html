<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>NPTEL AI Solver</title>
  <style>
    @font-face {
      font-family: "Space Mono";
      src: url("fonts/SpaceMono-Regular.ttf") format("truetype");
      font-weight: 400;
    }
    @font-face {
      font-family: "Space Mono";
      src: url("fonts/SpaceMono-Bold.ttf") format("truetype");
      font-weight: 700;
    }

    :root {
      --desk: #d6dbcf;
      --paper: #eef0e9;
      --ink: #1c1d1b;
      --muted: #858a82;
      --soft: #c3c8bc;
      --shadow: #1c1d1b;
      --dot: rgba(28, 29, 27, 0.35);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --desk: #0d0e0c;
        --paper: #1a1c19;
        --ink: #e8ece2;
        --muted: #7c8279;
        --soft: #3a3f38;
        --shadow: #000;
        --dot: rgba(232, 236, 226, 0.3);
      }
    }

    * { box-sizing: border-box; }

    html, body {
      width: 340px;
      margin: 0;
      background: var(--desk);
      color: var(--ink);
      font-family: "Space Mono", ui-monospace, Consolas, monospace;
      font-size: 12px;
      -webkit-font-smoothing: antialiased;
    }
    body { padding: 12px 14px 16px 12px; }

    .window {
      background: var(--paper);
      border: 2px solid var(--ink);
      border-radius: 14px;
      box-shadow: 5px 5px 0 var(--shadow);
      overflow: hidden;
    }

    /* Title bar */
    .titlebar {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      height: 36px;
      padding: 0 12px;
      border-bottom: 2px solid var(--ink);
    }
    .lights { display: flex; gap: 5px; }
    .lights span {
      width: 12px; height: 12px;
      border: 2px solid var(--ink);
      border-radius: 50%;
    }
    .lights span:first-child { background: var(--ink); }
    .titlebar h1 {
      margin: 0;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.02em;
    }
    .clock { justify-self: end; font-size: 12px; }

    .content { padding: 12px 14px 14px; }

    /* Status strip + hero */
    .meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 10px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    .key-flag { display: flex; align-items: center; gap: 6px; }
    .key-flag i {
      width: 8px; height: 8px;
      border: 1.5px solid var(--ink);
      border-radius: 50%;
    }
    .key-flag.on i { background: var(--ink); }
    .key-flag.on { color: var(--ink); }

    .hero {
      margin: 6px 0 12px;
      font-size: 34px;
      line-height: 1.05;
      font-weight: 400;
      letter-spacing: -0.02em;
    }

    /* Key pill */
    .pill {
      display: flex;
      align-items: center;
      gap: 8px;
      height: 44px;
      padding: 0 5px 0 14px;
      border: 1px solid var(--ink);
      border-radius: 999px;
    }
    .pill label {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.06em;
    }
    .pill input {
      flex: 1;
      min-width: 0;
      height: 100%;
      border: 0;
      outline: none;
      background: transparent;
      color: var(--ink);
      font: inherit;
      font-size: 12px;
    }
    .pill input::placeholder { color: var(--muted); }
    .pill:focus-within { box-shadow: 0 0 0 2px var(--ink) inset; }

    button {
      font: inherit;
      color: inherit;
      cursor: pointer;
    }
    button:focus-visible {
      outline: 2px solid var(--ink);
      outline-offset: 3px;
    }

    .save {
      height: 32px;
      padding: 0 14px;
      border: 0;
      border-radius: 999px;
      background: var(--ink);
      color: var(--paper);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.06em;
    }
    .save:active { transform: translateY(1px); }

    /* Stat cards */
    .cards {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 12px;
    }
    .card {
      border: 1px solid var(--ink);
      border-radius: 16px;
      padding: 11px 12px 12px;
    }
    .card h2 {
      margin: 0;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.04em;
    }
    .card .sub {
      font-size: 10px;
      color: var(--muted);
    }
    .card .body {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 6px;
      margin-top: 10px;
      min-height: 50px;
    }
    .big {
      font-size: 26px;
      line-height: 1;
      letter-spacing: -0.03em;
    }
    .big small {
      font-size: 13px;
      color: var(--muted);
      letter-spacing: 0;
    }

    .coil path { fill: none; stroke-width: 1.5; stroke-linecap: round; }
    .coil .coil-base { stroke: var(--soft); }
    .coil .coil-done { stroke: var(--ink); }

    .ring { position: relative; width: 46px; height: 46px; flex: none; }
    .ring svg { width: 46px; height: 46px; display: block; }
    .ring circle { fill: none; stroke-width: 5; }
    .ring .ring-track { stroke: var(--soft); }
    .ring .ring-fill {
      stroke: var(--ink);
      stroke-linecap: round;
      transition: stroke-dashoffset 0.5s ease;
    }
    .ring span {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      font-size: 10px;
    }
    .ring.spinning svg { animation: spin 0.9s linear infinite; }
    .ring.spinning span { visibility: hidden; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Action rows */
    .section-label {
      margin: 14px 0 6px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.06em;
    }
    .rows { border-top: 1px solid var(--ink); }
    .row {
      display: grid;
      grid-template-columns: 70px 1fr auto;
      align-items: center;
      gap: 8px;
      height: 48px;
      border-bottom: 1px solid var(--ink);
    }
    .row .name { font-size: 12px; letter-spacing: 0.02em; }
    .row .desc { font-size: 11px; color: var(--muted); }
    .row.primary .name,
    .row.primary .desc { font-weight: 700; color: var(--ink); }

    .toggle {
      position: relative;
      width: 68px;
      height: 32px;
      border: 1.5px solid var(--ink);
      border-radius: 999px;
      background: var(--paper);
      box-shadow: 2px 2px 0 var(--shadow);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.06em;
      transition: background 0.2s ease, color 0.2s ease;
    }
    .toggle:active:not(:disabled) {
      transform: translate(2px, 2px);
      box-shadow: none;
    }
    .toggle .knob {
      position: absolute;
      top: 3px;
      left: 3px;
      width: 23px;
      height: 23px;
      border: 1.5px solid var(--ink);
      border-radius: 50%;
      background: var(--paper);
      transition: left 0.25s ease, border-color 0.2s ease;
    }
    .toggle:hover:not(:disabled) .knob { left: 6px; }
    .toggle .lbl {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
    }
    .toggle .off { right: 9px; }
    .toggle .on { left: 11px; display: none; }

    .toggle[aria-busy="true"] {
      background: var(--ink);
      color: var(--paper);
      cursor: progress;
    }
    .toggle[aria-busy="true"] .knob {
      left: calc(100% - 27px);
      border-color: var(--paper);
    }
    .toggle[aria-busy="true"] .off { display: none; }
    .toggle[aria-busy="true"] .on { display: block; }
    .toggle:disabled:not([aria-busy="true"]) { opacity: 0.45; cursor: default; }

    /* Status line */
    #status {
      display: flex;
      gap: 8px;
      align-items: flex-start;
      margin-top: 12px;
      padding: 8px 10px;
      border: 1px solid var(--ink);
      border-radius: 10px;
      font-size: 11px;
      line-height: 1.5;
      word-break: break-word;
    }
    #status::before {
      flex: none;
      padding: 0 5px;
      border: 1px solid currentColor;
      border-radius: 4px;
      font-size: 9px;
      font-weight: 700;
      line-height: 16px;
      letter-spacing: 0.06em;
    }
    #status[data-state="idle"]::before { content: "RDY"; }
    #status[data-state="busy"]::before { content: "RUN"; }
    #status[data-state="ok"]::before { content: "OK"; }
    #status[data-state="error"]::before { content: "ERR"; }
    #status[data-state="busy"] { border-style: dashed; }
    #status[data-state="busy"]::after {
      content: "\258C";
      animation: blink 1s steps(1) infinite;
    }
    #status[data-state="error"] {
      background: var(--ink);
      color: var(--paper);
    }
    @keyframes blink { 50% { opacity: 0; } }

    /* Extraction preview */
    #preview {
      margin: 10px 0 0;
      max-height: 170px;
      overflow-y: auto;
      padding: 10px 12px;
      border: 1px solid var(--ink);
      border-radius: 10px;
      font: inherit;
      font-size: 10.5px;
      line-height: 1.55;
      white-space: pre-wrap;
      word-break: break-word;
    }
    #preview[hidden] { display: none; }
    #preview::-webkit-scrollbar { width: 12px; }
    #preview::-webkit-scrollbar-track {
      border-left: 1px solid var(--ink);
      background-image: radial-gradient(var(--dot) 1px, transparent 1.2px);
      background-size: 4px 4px;
    }
    #preview::-webkit-scrollbar-thumb {
      background: var(--paper);
      border: 1px solid var(--ink);
      border-radius: 0;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="window">
    <div class="titlebar">
      <div class="lights" aria-hidden="true"><span></span><span></span><span></span></div>
      <h1>NPTEL</h1>
      <div class="clock" id="clock">--:--</div>
    </div>

    <div class="content">
      <div class="meta">
        <span id="modelName">model</span>
        <span class="key-flag" id="keyFlag"><i></i><span id="keyFlagText">No key</span></span>
      </div>
      <div class="hero">Solver</div>

      <div class="pill">
        <label for="apiKey">KEY</label>
        <input type="password" id="apiKey" placeholder="paste gemini key" autocomplete="off" spellcheck="false">
        <button class="save" id="saveBtn">SAVE</button>
      </div>

      <div class="cards">
        <div class="card">
          <h2>QUESTIONS</h2>
          <div class="sub">on page</div>
          <div class="body">
            <svg class="coil" id="coil" height="46" aria-hidden="true"></svg>
            <div class="big" id="qCount">--</div>
          </div>
        </div>
        <div class="card">
          <h2>FILLED</h2>
          <div class="sub">selected</div>
          <div class="body">
            <div class="ring" id="ring">
              <svg viewBox="0 0 50 50" aria-hidden="true">
                <circle class="ring-track" cx="25" cy="25" r="20"></circle>
                <circle class="ring-fill" id="ringFill" cx="25" cy="25" r="20" transform="rotate(-90 25 25)"></circle>
              </svg>
              <span id="ringPct">0%</span>
            </div>
            <div class="big" id="fillCount">--</div>
          </div>
        </div>
      </div>

      <div class="section-label">ACTIONS</div>
      <div class="rows">
        <div class="row">
          <span class="name">PREVIEW</span>
          <span class="desc">scan page</span>
          <button class="toggle" id="previewBtn" aria-busy="false" aria-label="Preview extraction">
            <span class="lbl off">RUN</span><span class="lbl on">ON</span><span class="knob"></span>
          </button>
        </div>
        <div class="row primary">
          <span class="name">SOLVE</span>
          <span class="desc">ask + fill</span>
          <button class="toggle" id="solveBtn" aria-busy="false" aria-label="Solve assignment">
            <span class="lbl off">RUN</span><span class="lbl on">ON</span><span class="knob"></span>
          </button>
        </div>
      </div>

      <div id="status" data-state="idle" role="status">Idle.</div>
      <pre id="preview" hidden></pre>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
